<label class="docs-appbar-control">
  <span>Поведение</span>
  <select data-rui-appbar-behavior-target="docs-appbar">
    <option value="static">Static</option>
    <option value="sticky" selected>Sticky</option>
  </select>
</label>

<label class="docs-appbar-control">
  <span>Surface</span>
  <select data-rui-appbar-surface-target="docs-appbar">
    <option value="default" selected>Default</option>
    <option value="glass">Glass</option>
    <option value="glass-solid">Glass + Solid + Shadow</option>
    <option value="transparent">Transparent</option>
    <option value="solid">Solid</option>
  </select>
</label>
