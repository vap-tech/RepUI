{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="{% static 'docs/favicon.svg' %}">
    <title>RepUI Docs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'docs/docs.css' %}">
</head>
<body>
    <header class="docs-appbar">
        <div class="docs-toolbar">
            <a class="docs-brand" href="{% url 'docs:index' %}">RepUI Docs</a>
            <button class="docs-icon-button" type="button" aria-label="Сменить тему">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5M2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1m18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1M11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 1-1 1m0 18v2c0 .55 1 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 1-1 1M5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-1.03 1.03 0 1.41l1.06 1.06c.39.39 1.03 1.03 1.41 0s.39-1.03 0-1.41zM18.36 16.95c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03 1.03 1.41 0s.39-1.03 0-1.41zM19.42 5.99c.39-.39-1.03-1.03 0-1.41-.39-.39-1.03-.39-1.41 0-1.06 1.06-1.06 1.06 0 1.41s1.03.39 1.41 0zM7.05 18.36c-.39-.39-1.03 0-1.41 0s-1.03 1.03-1.41 0-.39-1.03 0-1.41 0-1.41 0-1.41z" />
                </svg>
            </button>
        </div>
    </header>

    <aside class="docs-sidebar" aria-label="Навигация документации">
        <nav
            id="docs-component-nav"
            hx-get="{% url 'docs:component-nav' %}"
            hx-trigger="load"
            hx-swap="innerHTML"
        >
            Загружаем разделы…
        </nav>
    </aside>

    <main class="docs-main">
    </main>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</body>
</html>
