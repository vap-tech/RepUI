name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[build]

      - name: Django checks
        run: python manage.py check

      - name: Tests
        run: python manage.py test

      - name: JavaScript interaction tests
        run: node --test tests/js/*.test.mjs

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser interaction tests
        env:
          RUI_PYTHON: python
        run: npm run test:browser

      - name: JavaScript syntax
        run: find repui/static -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Static files
        run: python manage.py collectstatic --noinput

      - name: Build distribution
        run: python -m build

      - name: Verify wheel package data
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              files = set(archive.namelist())

          required = {
              "repui/templates/repui/components/button/button.html",
              "repui/static/repui/components/button/button.css",
              "repui/static/repui/runtime/bootstrap.js",
              "repui/static/repui/theme/default/light.css",
          }
          missing = required - files
          if missing:
            raise SystemExit(
                "Wheel is missing package data: "
                + ", ".join(sorted(missing))
            )

          icon_json = [
              path for path in files
              if path.startswith("repui/static/repui/icons/")
              and path.endswith(".json")
          ]
          if icon_json:
              raise SystemExit(
                  "Wheel must not contain icon JSON metadata: "
                  + str(len(icon_json))
              )
          PY
