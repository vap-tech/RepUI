{% load repui_attrs %}
<article
  class="rui-card{% if class_name %} {{ class_name }}{% endif %}"
  data-surface="{{ surface }}"
  data-width="{{ width }}"
  data-height="{{ height }}"
  data-overflow="{{ overflow }}"
  data-sections="{% if has_sections %}true{% else %}false{% endif %}"
  {% html_attrs layout_attrs %}
  {% html_attrs attrs %}
>
  <div class="rui-card__surface">
    {% if has_sections %}
      <div class="rui-card__sections">
        {{ content|safe }}
      </div>
    {% else %}
      <div class="rui-card__content">
        {{ content|safe }}
      </div>
    {% endif %}
  </div>
</article>
