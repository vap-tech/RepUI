{% load repui_attrs %}
{% if href and not disabled %}
<a class="rui-icon-button{% if class_name %} {{ class_name }}{% endif %}"
   href="{{ href }}"
   aria-label="{{ aria_label }}"
   {% html_attrs attrs %}>{{ content|safe }}</a>
{% else %}
<button class="rui-icon-button{% if class_name %} {{ class_name }}{% endif %}"
        type="button"
        aria-label="{{ aria_label }}"
        {% if disabled %}disabled aria-disabled="true"{% endif %}
        {% html_attrs attrs %}>{{ content|safe }}</button>
{% endif %}
