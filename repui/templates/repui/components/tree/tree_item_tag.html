{% load repui_attrs %}<div class="rui-tree-item{% if class_name %} {{ class_name }}{% endif %}" role="treeitem" data-rui-tree-item tabindex="-1" aria-selected="{{ selected|default:False|yesno:'true,false' }}"{% if content %} aria-expanded="{{ expanded|default:False|yesno:'true,false' }}"{% endif %}{% if disabled %} aria-disabled="true"{% endif %} {% html_attrs attrs %}><div class="rui-tree-item__row"><span class="rui-tree-item__indicator" aria-hidden="true"></span><span class="rui-tree-item__label">{{ label }}</span></div>{% if content %}<div class="rui-tree-item__group" role="group"{% if not expanded %} hidden{% endif %}>{{ content|safe }}</div>{% endif %}</div>
