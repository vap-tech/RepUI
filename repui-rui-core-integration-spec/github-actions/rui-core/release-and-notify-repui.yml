name: Release bundle and notify RepUI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing rui-core tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rui-core-delivery-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:dom
      - run: npm run build:repui
      - run: npm run verify:exports
      - run: npm run verify:size
      - id: meta
        run: |
          echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rui-core-${{ steps.meta.outputs.tag }}
          path: dist/repui/
          if-no-files-found: error
  notify:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.REPUI_DISPATCH_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/vap-tech/RepUI/dispatches \
            -f event_type='rui-core-released' \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[sha]=$SHA" \
            -f "client_payload[repository]=vap-tech/rui-core"
