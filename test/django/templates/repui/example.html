{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RepUI component draft</title>
    <link rel="stylesheet" href="{% static 'foundation/css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'foundation/css/controls.css' %}">
    <link rel="stylesheet" href="{% static 'components/select/component.css' %}">
    <link rel="stylesheet" href="{% static 'components/menu/component.css' %}">
    <link rel="stylesheet" href="{% static 'components/listbox/component.css' %}">
    <link rel="stylesheet" href="{% static 'components/combobox/component.css' %}">
    <link rel="stylesheet" href="{% static 'components/sheet/component.css' %}">
</head>
<body>
    <main>
        <h1>RepUI component draft</h1>

        <section>
            <h2>Select</h2>
            <div data-rui-component="select" class="rui-select"></div>
        </section>

        <section>
            <h2>Menu</h2>
            <div data-rui-component="menu" class="rui-menu"></div>
        </section>

        <section>
            <h2>Listbox</h2>
            <div data-rui-component="listbox" class="rui-listbox"></div>
        </section>

        <section>
            <h2>Combobox</h2>
            <div data-rui-component="combobox" class="rui-combobox"></div>
        </section>

        <section>
            <h2>Sheet</h2>
            <div data-rui-component="sheet" class="rui-sheet"></div>
        </section>
    </main>

    <script type="module">
        import { mount as mountSelect } from "{% static 'components/select/component.js' %}";
        import { mount as mountMenu } from "{% static 'components/menu/component.js' %}";
        import { mount as mountListbox } from "{% static 'components/listbox/component.js' %}";
        import { mount as mountCombobox } from "{% static 'components/combobox/component.js' %}";
        import { mount as mountSheet } from "{% static 'components/sheet/component.js' %}";

        mountSelect(document.querySelector('[data-rui-component="select"]'));
        mountMenu(document.querySelector('[data-rui-component="menu"]'));
        mountListbox(document.querySelector('[data-rui-component="listbox"]'));
        mountCombobox(document.querySelector('[data-rui-component="combobox"]'));
        mountSheet(document.querySelector('[data-rui-component="sheet"]'));
    </script>
</body>
</html>
