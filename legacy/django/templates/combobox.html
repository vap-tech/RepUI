<div class="rui-combobox" data-rui-combobox>
    <input
        data-rui-value
        type="hidden"
        name="{{ name }}"
        value="{{ value|default:'' }}"
    />
    <div class="rui-control">
        <input
            class="rui-input rui-combobox__input"
            data-rui-input
            value="{{ selected_label|default:'' }}"
            placeholder="{{ placeholder|default:'Начните вводить…' }}"
            autocomplete="off"
        /><button
            class="rui-control__clear"
            type="button"
            data-rui-combobox-clear
            hidden
            aria-label="Очистить"
        >
            ×
        </button>
    </div>
    <div class="rui-combobox__content" data-rui-popup hidden>
        <div class="rui-combobox__list" data-rui-combobox-list>
            {% for option in options %}<button
                class="rui-option"
                type="button"
                data-rui-option
                data-value="{{ option.value }}"
                data-keywords="{{ option.keywords|default:'' }}"
            >
                <span class="rui-option__copy"
                    ><span class="rui-option__label" data-rui-option-label
                        >{{ option.label }}</span
                    >{% if option.description %}<span
                        class="rui-option__description"
                        >{{ option.description }}</span
                    >{% endif %}</span
                ></button
            >{% endfor %}
        </div>
        <p class="rui-combobox__empty" data-rui-combobox-empty hidden>
            {{ empty_text|default:'Ничего не найдено' }}
        </p>
    </div>
</div>
