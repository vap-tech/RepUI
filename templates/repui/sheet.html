<div class="rui-sheet" id="{{ id }}" data-rui-sheet data-side="{{ side|default:'right' }}"{% if size %} data-size="{{ size }}"{% endif %} hidden aria-hidden="true">
  <div class="rui-sheet__backdrop"></div>
  <section class="rui-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="{{ id }}-title" tabindex="-1">
    {% if side == 'bottom' %}<span class="rui-sheet__handle" aria-hidden="true"></span>{% endif %}
    <header class="rui-sheet__header">
      <div class="rui-sheet__heading">
        <h2 class="rui-sheet__title" id="{{ id }}-title">{{ title }}</h2>
        {% if description %}<p class="rui-sheet__description">{{ description }}</p>{% endif %}
      </div>
      <button class="rui-sheet__close" type="button" data-rui-sheet-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="rui-sheet__body">{{ content }}</div>
    {% if footer %}<footer class="rui-sheet__footer">{{ footer }}</footer>{% endif %}
  </section>
</div>
