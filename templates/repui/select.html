<div class="rui-select" data-rui-select>
  <input type="hidden" name="{{ name }}" value="{{ value|default:'' }}"{% if required %} required{% endif %}>
  <button class="rui-select__trigger" type="button" data-rui-select-trigger aria-expanded="false"{% if disabled %} disabled{% endif %}>
    <span class="rui-select__value" data-rui-select-value data-placeholder="{% if value %}false{% else %}true{% endif %}">{{ selected_label|default:placeholder }}</span>
    <span class="rui-select__chevron rui-disclosure__icon" aria-hidden="true"><span class="rui-symbol rui-symbol--chevron" aria-hidden="true">⌄</span></span>
  </button>
  <div class="rui-select__content" data-rui-select-content hidden>
    {% if searchable %}<div class="rui-select__search-wrap"><input class="rui-input" data-rui-select-search placeholder="{{ search_placeholder|default:'Поиск…' }}"></div>{% endif %}
    <div class="rui-select__list" data-rui-select-list>
      {% for option in options %}<button class="rui-option" type="button" data-rui-option data-value="{{ option.value }}"{% if option.value|stringformat:'s' == value|stringformat:'s' %} aria-selected="true"{% endif %}{% if option.disabled %} aria-disabled="true"{% endif %}><span class="rui-option__check" aria-hidden="true"><span class="rui-symbol rui-symbol--check" aria-hidden="true">✓</span></span><span class="rui-option__copy"><span class="rui-option__label" data-rui-option-label>{{ option.label }}</span>{% if option.description %}<span class="rui-option__description">{{ option.description }}</span>{% endif %}</span></button>{% endfor %}
    </div>
    <p class="rui-select__empty" data-rui-select-empty hidden>{{ empty_text|default:'Ничего не найдено' }}</p>
  </div>
</div>
